<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3社会 2学期中間対策テスト 4</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#222}
header{background:#17365d;color:#fff;padding:22px 5%;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
.qno{font-weight:700;color:#17365d} .section{font-size:1.2em;font-weight:700;margin-top:25px}
label{display:block;padding:8px;border-radius:8px} label:hover{background:#eef3f9}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
#grade{background:#fff;border-radius:12px;padding:20px;margin:20px 0;display:none}
.ok{border-left:5px solid #2e7d32} .ng{border-left:5px solid #c62828}
.small{font-size:.9em;color:#666}
</style></head>
<body>
<header><h1>中学3年 社会 2学期中間対策テスト 4</h1>
<div>歴史25問＋公民25問／50問・100点満点／1問2点</div></header>
<main>
<p class="small">すべて解答してから「採点する」を押してください。選択肢は4択です。</p>
<form id="test"></form>
<button onclick="grade();return false;">採点する</button>
<div id="grade"></div>
</main>
<script>
const questions=[{"q": "冷戦の中で、東西両陣営の対立が最も象徴的に表れた都市はどこか。", "choices": ["ベルリン", "東京", "北京", "パリ"], "answer": 0}, {"q": "1962年に核戦争の危機が高まった出来事はどれか。", "choices": ["キューバ危機", "スエズ危機", "石油危機", "湾岸戦争"], "answer": 0}, {"q": "1950年代後半、ソ連が人工衛星スプートニク1号を打ち上げたことは何を示したか。", "choices": ["米ソの宇宙開発競争", "日本の高度成長", "冷戦終結", "EU成立"], "answer": 0}, {"q": "日本の独立回復後、1950年代に日米関係を支えた条約はどれか。", "choices": ["日米安全保障条約", "日韓基本条約", "日中共同声明", "ワルシャワ条約"], "answer": 0}, {"q": "1955年に日本が加盟した国際組織はどれか。", "choices": ["GATT", "EU", "NATO", "ASEAN"], "answer": 0}, {"q": "1960年の日米安全保障条約改定に反対する大規模な運動を何というか。", "choices": ["安保闘争", "米騒動", "護憲運動だけ", "自由民権運動"], "answer": 0}, {"q": "高度経済成長期に普及した自動車やカラーテレビなどは、人々の何を変化させたか。", "choices": ["生活様式", "国民主権", "憲法の条文", "国境"], "answer": 0}, {"q": "1960年代後半に日本の国民総生産が世界第2位となったことは何を示すか。", "choices": ["経済大国化", "植民地化", "農業国化", "鎖国"], "answer": 0}, {"q": "公害を防止するため1971年に設置された行政機関はどれか。", "choices": ["環境庁", "文部省", "外務省", "法務省"], "answer": 0}, {"q": "1972年に沖縄が日本に返還された背景にあるものはどれか。", "choices": ["日本の施政権が回復したこと", "日本が独立したこと", "冷戦が始まったこと", "国連から脱退したこと"], "answer": 0}, {"q": "石油危機を受け、日本企業が開発を進めた技術として適切なのはどれか。", "choices": ["省エネルギー技術", "蒸気機関だけ", "木炭自動車だけ", "手工業技術だけ"], "answer": 0}, {"q": "1980年代、日本が経済大国として国際的な影響力を強めた一方で生じた問題はどれか。", "choices": ["貿易摩擦", "農地改革", "植民地問題", "鎖国問題"], "answer": 0}, {"q": "1990年代に冷戦が終結したことで世界はどのように変化したか。", "choices": ["東西対立の構図が大きく変化した", "国際交流がなくなった", "戦争がすべてなくなった", "国家がすべて消滅した"], "answer": 0}, {"q": "1991年に独立した共和国が多数生まれた地域はどこか。", "choices": ["旧ソ連地域", "西ヨーロッパ", "北アメリカ", "オセアニア"], "answer": 0}, {"q": "1990年代、日本で国際貢献の一環として行われた活動はどれか。", "choices": ["PKO協力", "植民地支配", "武器輸出の全面自由化", "国際機関の脱退"], "answer": 0}, {"q": "1995年に発生した阪神・淡路大震災で重要性が再認識されたものはどれか。", "choices": ["防災と地域の助け合い", "海外植民地", "冷戦", "石油輸出"], "answer": 0}, {"q": "2000年代、日本とアジア諸国との経済関係が深まった背景はどれか。", "choices": ["貿易や企業活動の拡大", "鎖国", "国際分業の消滅", "人口の急減だけ"], "answer": 0}, {"q": "戦後文化で、漫画やアニメが発展した背景として適切なのはどれか。", "choices": ["大衆文化やメディアの発達", "情報の減少", "出版の禁止", "教育制度の廃止"], "answer": 0}, {"q": "1960年代以降、若者の間でロック音楽などが広がったことは何を示すか。", "choices": ["文化の多様化", "文化の単一化", "身分制度", "軍国化"], "answer": 0}, {"q": "インターネットの普及によって世界の人々が容易に情報をやり取りできるようになったことは何の一例か。", "choices": ["グローバル化", "鎖国", "工業化以前の社会", "封建化"], "answer": 0}, {"q": "現代の日本がアジア諸国と協力する分野として適切なのはどれか。", "choices": ["環境・災害対策・経済など", "植民地支配", "国境閉鎖", "貿易禁止"], "answer": 0}, {"q": "日本の国際協力の一つであるODAは何か。", "choices": ["政府開発援助", "国際オリンピック委員会", "国際通貨基金", "世界貿易機関"], "answer": 0}, {"q": "これからの国際社会で重要となる課題の一つはどれか。", "choices": ["地球環境問題", "国際交流の停止", "情報通信の禁止", "文化の一様化"], "answer": 0}, {"q": "戦後の日本で大衆化した文化を支えたメディアとして特に重要なのはどれか。", "choices": ["テレビ", "石碑", "瓦版だけ", "狼煙"], "answer": 0}, {"q": "経済成長に伴って都市の人口が増える一方、農村で人口が減る現象を何というか。", "choices": ["過疎化", "少子化だけ", "国際化", "工業化"], "answer": 0}, {"q": "持続可能な社会を考えるとき、将来世代への責任という視点が重要なのはなぜか。", "choices": ["現在の資源利用が将来の生活に影響するため", "未来のことは考えなくてよいため", "環境問題が存在しないため", "資源が無限だから"], "answer": 0}, {"q": "環境問題への対策として「3R」のReduceは何を意味するか。", "choices": ["ごみを減らす", "再使用する", "再生利用する", "修理する"], "answer": 0}, {"q": "デジタル社会で著作権を守る行動はどれか。", "choices": ["他人の作品を利用するときルールを確認する", "ネット上なら自由にコピーする", "作者名を消して使う", "有料作品を無断配布する"], "answer": 0}, {"q": "情報モラルとして適切なのはどれか。", "choices": ["相手の立場や権利を考えて発信する", "匿名なら何を言ってもよい", "個人情報を公開する", "誤情報でも拡散する"], "answer": 0}, {"q": "グローバル化によって、食料や製品の供給が海外に依存することがある。このとき重要な視点はどれか。", "choices": ["国際的な分業とリスクを考える", "貿易をすべて禁止する", "外国をすべて拒否する", "国内生産をなくす"], "answer": 0}, {"q": "国際社会で異文化理解が重要な理由はどれか。", "choices": ["異なる価値観を持つ人々が協力する必要があるため", "文化の違いをなくすため", "国境をなくすため", "言語を一つにするため"], "answer": 0}, {"q": "少子高齢化によって労働力人口が減少する可能性への対応として考えられるものはどれか。", "choices": ["働き方や子育て支援の改善", "教育の廃止", "高齢者の排除", "外国との交流停止"], "answer": 0}, {"q": "高齢者が住み慣れた地域で生活を続けられるよう支援する考え方と関係が深いものはどれか。", "choices": ["地域包括ケア", "鎖国", "中央集権", "軍事同盟"], "answer": 0}, {"q": "日本の伝統文化を継承する担い手が減少する問題への対応として適切なのはどれか。", "choices": ["学校や地域で体験する機会をつくる", "文化を保存せず廃止する", "若者の参加を禁止する", "外国人だけに任せる"], "answer": 0}, {"q": "文化の継承でデジタル技術を利用する例はどれか。", "choices": ["祭りや技術を映像・データで記録する", "記録をすべて廃棄する", "口伝を禁止する", "文化財を破壊する"], "answer": 0}, {"q": "社会生活で意見が対立したときに必要なのはどれか。", "choices": ["互いの利害を整理し合意を目指すこと", "相手を無視すること", "力の強い人が決めること", "少数者を排除すること"], "answer": 0}, {"q": "効率と公正を考える際、全員に同じ量を配ることが必ず公正とは限らない理由はどれか。", "choices": ["人によって必要な支援や事情が異なるため", "全員が同じだから", "効率が必ず上がるため", "法律で禁止されているため"], "answer": 0}, {"q": "社会のきまりが正当であるために重要なのはどれか。", "choices": ["理由や目的が納得でき、手続きが適切であること", "一人が勝手に決めること", "罰を重くすることだけ", "変更できないこと"], "answer": 0}, {"q": "民主主義で選挙が重要なのはなぜか。", "choices": ["国民が代表者を選び政治に意思を反映できるため", "政治家を世襲するため", "裁判をなくすため", "少数意見を消すため"], "answer": 0}, {"q": "立憲主義のもとで憲法が国家権力を制限するのはなぜか。", "choices": ["人権を保障するため", "政府を強くするため", "国民の自由をなくすため", "選挙を禁止するため"], "answer": 0}, {"q": "法の支配では、法律そのものも何に従う必要があるか。", "choices": ["憲法", "世論だけ", "政府の命令だけ", "多数派の感情だけ"], "answer": 0}, {"q": "日本国憲法の基本的人権は、国民だけでなくどのような人にも保障される考え方が基本か。", "choices": ["人として生きるすべての人", "選挙権を持つ人だけ", "公務員だけ", "成人だけ"], "answer": 0}, {"q": "日本国憲法の「国民主権」は、戦前の「天皇主権」と何が異なるか。", "choices": ["政治の最終的な決定権の所在", "国土の広さ", "人口の多さ", "国際連盟への加盟"], "answer": 0}, {"q": "日本国憲法の平和主義と関連する条文はどれか。", "choices": ["第9条", "第13条", "第25条", "第41条"], "answer": 0}, {"q": "憲法第13条が保障する個人の尊重と関係が深い権利はどれか。", "choices": ["幸福追求権", "参政権だけ", "請願権だけ", "納税の義務"], "answer": 0}, {"q": "思想・良心の自由や信教の自由は何の自由に分類されるか。", "choices": ["精神の自由", "経済活動の自由", "身体の自由", "社会権"], "answer": 0}, {"q": "居住・移転の自由や職業選択の自由は、主にどの分類に入るか。", "choices": ["経済活動・居住などの自由", "精神の自由だけ", "身体の自由だけ", "参政権"], "answer": 0}, {"q": "身体の自由の保障として、逮捕には原則として何が必要か。", "choices": ["令状", "選挙", "国会の同意だけ", "新聞報道"], "answer": 0}, {"q": "表現の自由が保障されることの意義はどれか。", "choices": ["政治や社会について意見を表明できる", "他人の権利を無制限に侵害できる", "法律を破れる", "裁判を拒否できる"], "answer": 0}, {"q": "人権同士が衝突する場合、重要なのは何か。", "choices": ["互いの権利を尊重しながら調整すること", "一方の人権を必ずなくすこと", "多数派だけを優先すること", "政府の判断だけに従うこと"], "answer": 0}];
const form=document.getElementById('test');
questions.forEach((x,i)=>{
 const section=i<25?'歴史':'公民';
 if(i===0||i===25) form.insertAdjacentHTML('beforeend',`<div class="section">${section}</div>`);
 let s=`<div class="card"><div class="qno">問${i+1}（2点）</div><div>${x.q}</div>`;
 x.choices.forEach((c,j)=>s+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}．${c}</label>`);
 s+='</div>'; form.insertAdjacentHTML('beforeend',s);
});
function grade(){
 let score=0,un=0;
 questions.forEach((x,i)=>{
  const a=document.querySelector(`input[name=q${i}]:checked`);
  if(!a) un++; else if(+a.value===x.answer) score+=2;
 });
 const g=document.getElementById('grade');
 g.style.display='block';
 let msg=score>=90?'90点以上です。よくできています。':score>=80?'80点以上です。間違えた問題を復習しましょう。':'まずは間違えた問題の用語・理由を確認しましょう。';
 g.innerHTML=`<h2>結果：${score} / 100点</h2><p>${msg}</p><p>未回答：${un}問</p>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
