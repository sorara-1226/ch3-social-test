<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3社会 2学期中間対策テスト 3</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#222}
header{background:#17365d;color:#fff;padding:22px 5%;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
.qno{font-weight:700;color:#17365d} .section{font-size:1.2em;font-weight:700;margin-top:25px}
label{display:block;padding:8px;border-radius:8px} label:hover{background:#eef3f9}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
#grade{background:#fff;border-radius:12px;padding:20px;margin:20px 0;display:none}
.ok{border-left:5px solid #2e7d32} .ng{border-left:5px solid #c62828}
.small{font-size:.9em;color:#666}
</style></head>
<body>
<header><h1>中学3年 社会 2学期中間対策テスト 3</h1>
<div>歴史25問＋公民25問／50問・100点満点／1問2点</div></header>
<main>
<p class="small">すべて解答してから「採点する」を押してください。選択肢は4択です。</p>
<form id="test"></form>
<button onclick="grade();return false;">採点する</button>
<div id="grade"></div>
</main>
<script>
const questions=[{"q": "冷戦下でアメリカが中心となった軍事同盟はどれか。", "choices": ["NATO", "ASEAN", "EU", "OPEC"], "answer": 0}, {"q": "冷戦下でソ連側の東ヨーロッパ諸国などが結成した軍事同盟はどれか。", "choices": ["ワルシャワ条約機構", "NATO", "ASEAN", "APEC"], "answer": 0}, {"q": "1955年、アジア・アフリカの新興独立国が集まった会議はどれか。", "choices": ["バンドン会議", "ヤルタ会談", "ポツダム会談", "サンフランシスコ会議"], "answer": 0}, {"q": "1960年代にベトナムをめぐって起こった戦争はどれか。", "choices": ["ベトナム戦争", "朝鮮戦争", "湾岸戦争", "日中戦争"], "answer": 0}, {"q": "日本が主権を回復した後も、アメリカ軍基地が多く置かれた地域はどこか。", "choices": ["沖縄", "北海道", "東北", "北陸"], "answer": 0}, {"q": "1965年に日本と韓国の国交正常化のために結ばれた条約はどれか。", "choices": ["日韓基本条約", "日中共同声明", "日ソ共同宣言", "日米安全保障条約"], "answer": 0}, {"q": "高度経済成長期に農村から都市へ人口が移動した現象は何と関係が深いか。", "choices": ["都市化", "過疎化だけ", "鎖国", "国際連盟"], "answer": 0}, {"q": "1960年代に建設された高速道路や新幹線などは何を支えたか。", "choices": ["経済発展と人・物の移動", "植民地支配", "鎖国", "農業人口の増加"], "answer": 0}, {"q": "四大公害病のうち、工場排水に含まれる有機水銀が原因となったものはどれか。", "choices": ["水俣病", "四日市ぜんそく", "イタイイタイ病", "新潟水俣病以外のすべて"], "answer": 0}, {"q": "四日市ぜんそくの主な原因と関係が深いものはどれか。", "choices": ["大気汚染", "水質汚濁", "土壌汚染", "騒音だけ"], "answer": 0}, {"q": "1970年代の石油危機後、日本で進んだ産業の変化はどれか。", "choices": ["省エネルギー型産業への転換", "石油使用量の無制限な増加", "農業への全面転換", "工業の全面停止"], "answer": 0}, {"q": "1980年代、日本が自動車や電機製品などの輸出を拡大したことで問題になったものはどれか。", "choices": ["貿易摩擦", "鎖国", "農地不足", "冷戦の開始"], "answer": 0}, {"q": "1989年に東西冷戦の象徴だった壁が開放された出来事はどれか。", "choices": ["ベルリンの壁崩壊", "万里の長城開放", "長城事件", "キューバ危機"], "answer": 0}, {"q": "1991年に湾岸戦争が起きた地域はどこか。", "choices": ["中東", "東ヨーロッパ", "南アメリカ", "北極圏"], "answer": 0}, {"q": "1992年、日本の国際平和協力法に基づき可能になった活動はどれか。", "choices": ["PKOへの参加", "海外植民地の統治", "軍事同盟への強制加入", "核兵器の保有"], "answer": 0}, {"q": "1990年代、日本で金融機関や企業の不良債権問題などが深刻化した背景にあるものはどれか。", "choices": ["バブル経済崩壊", "高度経済成長", "戦後復興", "石油危機以前"], "answer": 0}, {"q": "2001年にアメリカで起きた同時多発テロは国際社会にどのような課題を示したか。", "choices": ["テロ対策と国際協力", "農業問題だけ", "鎖国政策", "植民地政策"], "answer": 0}, {"q": "2000年代、日本の人口構造で進んだ傾向はどれか。", "choices": ["少子高齢化", "若年人口の急増", "出生率の急上昇", "平均寿命の大幅低下"], "answer": 0}, {"q": "戦後、映画・音楽・漫画などの娯楽が広く普及した背景の一つはどれか。", "choices": ["テレビなどのマスメディアの発達", "識字率の低下", "国際交流の停止", "農村人口の増加"], "answer": 0}, {"q": "戦後の若者文化が多様化したことと関係が深いものはどれか。", "choices": ["生活様式や価値観の多様化", "身分制度の復活", "情報量の減少", "文化活動の禁止"], "answer": 0}, {"q": "冷戦終結後の世界で進んだ地域統合の例はどれか。", "choices": ["EU", "ワルシャワ条約機構", "大日本帝国", "満州国"], "answer": 0}, {"q": "日本の国際的な役割として、災害時に他国へ支援を行うことは何と関係が深いか。", "choices": ["国際協力", "植民地化", "鎖国", "軍事的中立の放棄"], "answer": 0}, {"q": "現代のアジアで経済発展が進んだ地域の例として適切なのはどれか。", "choices": ["中国や東南アジア諸国", "南極大陸", "北極圏", "古代ローマ"], "answer": 0}, {"q": "グローバル化が進むと、企業活動はどうなりやすいか。", "choices": ["国境を越えて生産・販売を行う", "国内だけに限定される", "貿易がなくなる", "情報が遮断される"], "answer": 0}, {"q": "これからの日本に求められる国際社会への関わり方として適切なのはどれか。", "choices": ["国際協力と課題解決への参加", "他国との関係を断つ", "国際機関から脱退する", "輸入を全面停止する"], "answer": 0}, {"q": "持続可能な社会の実現に向けて、再生可能エネルギーを利用する理由として適切なのはどれか。", "choices": ["資源や環境への負荷を考えながらエネルギーを確保するため", "化石燃料を無制限に使うため", "電力をなくすため", "産業を停止するため"], "answer": 0}, {"q": "SDGsの目標は何個あるか。", "choices": ["17", "10", "25", "50"], "answer": 0}, {"q": "情報通信技術が社会に与える利点はどれか。", "choices": ["遠くの人とも情報を共有しやすい", "必ず情報が正しい", "犯罪がなくなる", "個人情報が完全に守られる"], "answer": 0}, {"q": "フェイクニュースなどに惑わされないために必要なことはどれか。", "choices": ["複数の信頼できる情報源を確認する", "見出しだけで判断する", "拡散数だけで正しさを決める", "匿名情報を必ず信じる"], "answer": 0}, {"q": "グローバル化による課題として考えられるものはどれか。", "choices": ["国際競争の激化や格差など", "国際交流の完全な消滅", "情報の減少", "貿易の消滅"], "answer": 0}, {"q": "外国人労働者の受け入れを考えるときに重要なことはどれか。", "choices": ["労働条件や人権を尊重すること", "差別すること", "権利を認めないこと", "文化交流を禁止すること"], "answer": 0}, {"q": "少子化対策として子育て世代への支援が重要なのはなぜか。", "choices": ["子育ての負担を社会全体で支えるため", "高齢者を減らすため", "学校をなくすため", "外国人を排除するため"], "answer": 0}, {"q": "高齢化社会で重要となる地域の取り組みはどれか。", "choices": ["医療・介護や地域での支え合い", "高齢者の移住禁止", "公共施設の全面閉鎖", "社会保障の廃止"], "answer": 0}, {"q": "文化財を保存することの意義はどれか。", "choices": ["過去の文化を将来へ伝えるため", "文化を固定して交流をなくすため", "観光だけを目的にするため", "外国文化を排除するため"], "answer": 0}, {"q": "日本文化の特徴として適切なのはどれか。", "choices": ["外国の文化を取り入れながら発展してきた", "外国文化の影響を一切受けていない", "文化が一つしかない", "地域差がない"], "answer": 0}, {"q": "社会的存在として生きる人間にとって、他者との対話が重要なのはなぜか。", "choices": ["価値観の違いを理解し合い合意を形成するため", "自分の意見を必ず押し通すため", "他人を排除するため", "法律をなくすため"], "answer": 0}, {"q": "効率を重視した判断の例として適切なのはどれか。", "choices": ["限られた予算で最大の効果を目指す", "すべての人に同じ結果を保障する", "少数者だけを優先する", "話し合いを禁止する"], "answer": 0}, {"q": "公正を考える際に重要な視点はどれか。", "choices": ["立場や事情の違いを考慮する", "常に全員を同じ扱いにする", "多数派だけを優先する", "弱い立場の人を無視する"], "answer": 0}, {"q": "きまりを守ることが必要な理由として適切なのはどれか。", "choices": ["互いの権利や生活を守るため", "自由をすべてなくすため", "権力者だけを守るため", "意見を言えなくするため"], "answer": 0}, {"q": "民主主義で話し合いを重視する理由はどれか。", "choices": ["異なる意見を調整し合意を目指すため", "多数派を絶対化するため", "少数意見を消すため", "選挙をなくすため"], "answer": 0}, {"q": "立憲主義が生まれた背景として関係が深いものはどれか。", "choices": ["権力の濫用を防ぎ人権を保障する必要", "王の権力を強める必要", "国民の権利をなくす必要", "裁判を廃止する必要"], "answer": 0}, {"q": "法の支配に反するものはどれか。", "choices": ["権力者だから法律を守らなくてよいとすること", "すべての人が法に従うこと", "権力を憲法で制限すること", "裁判で法を適用すること"], "answer": 0}, {"q": "日本国憲法の三大原則の組合せとして正しいものはどれか。", "choices": ["国民主権・基本的人権の尊重・平和主義", "天皇主権・軍国主義・身分制", "地方自治・市場経済・鎖国", "多数決・効率・公正"], "answer": 0}, {"q": "日本国憲法は、国民の基本的人権を保障すると同時に、国民に何を求めているか。", "choices": ["不断の努力によって保持すること", "人権を放棄すること", "政府にすべて任せること", "選挙を行わないこと"], "answer": 0}, {"q": "国民主権の考え方と関係する「代表民主制」とは何か。", "choices": ["国民が選挙で代表者を選び政治を行う仕組み", "国王が代表を任命する仕組み", "裁判官だけが政治をする仕組み", "軍人だけが政治をする仕組み"], "answer": 0}, {"q": "日本国憲法の平和主義と関係が深いものはどれか。", "choices": ["戦争の放棄", "徴兵制", "植民地支配", "核兵器の保有"], "answer": 0}, {"q": "基本的人権が保障される理由として適切なのはどれか。", "choices": ["すべての人が個人として尊重されるため", "多数派だけを守るため", "国家の都合を優先するため", "人によって価値を変えるため"], "answer": 0}, {"q": "思想・良心の自由が保障される意味はどれか。", "choices": ["心の中で何を考えるかを国家から強制されない", "どんな犯罪も許される", "他人の財産を自由に奪える", "選挙に必ず参加できる"], "answer": 0}, {"q": "集会・結社・表現の自由に共通するものはどれか。", "choices": ["精神活動や社会への意見表明に関わる自由", "身体を拘束されない自由", "財産を持つ自由", "居住地を選ぶ自由"], "answer": 0}, {"q": "職業選択の自由はどの種類の自由権に含まれるか。", "choices": ["経済活動の自由", "精神の自由", "身体の自由", "参政権"], "answer": 0}];
const form=document.getElementById('test');
questions.forEach((x,i)=>{
 const section=i<25?'歴史':'公民';
 if(i===0||i===25) form.insertAdjacentHTML('beforeend',`<div class="section">${section}</div>`);
 let s=`<div class="card"><div class="qno">問${i+1}（2点）</div><div>${x.q}</div>`;
 x.choices.forEach((c,j)=>s+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}．${c}</label>`);
 s+='</div>'; form.insertAdjacentHTML('beforeend',s);
});
function grade(){
 let score=0,un=0;
 questions.forEach((x,i)=>{
  const a=document.querySelector(`input[name=q${i}]:checked`);
  if(!a) un++; else if(+a.value===x.answer) score+=2;
 });
 const g=document.getElementById('grade');
 g.style.display='block';
 let msg=score>=90?'90点以上です。よくできています。':score>=80?'80点以上です。間違えた問題を復習しましょう。':'まずは間違えた問題の用語・理由を確認しましょう。';
 g.innerHTML=`<h2>結果：${score} / 100点</h2><p>${msg}</p><p>未回答：${un}問</p>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
