<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3社会 2学期中間対策テスト 1</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#222}
header{background:#17365d;color:#fff;padding:22px 5%;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
.qno{font-weight:700;color:#17365d} .section{font-size:1.2em;font-weight:700;margin-top:25px}
label{display:block;padding:8px;border-radius:8px} label:hover{background:#eef3f9}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
#grade{background:#fff;border-radius:12px;padding:20px;margin:20px 0;display:none}
.ok{border-left:5px solid #2e7d32} .ng{border-left:5px solid #c62828}
.small{font-size:.9em;color:#666}
</style></head>
<body>
<header><h1>中学3年 社会 2学期中間対策テスト 1</h1>
<div>歴史25問＋公民25問／50問・100点満点／1問2点</div></header>
<main>
<p class="small">すべて解答してから「採点する」を押してください。選択肢は4択です。</p>
<form id="test"></form>
<button onclick="grade();return false;">採点する</button>
<div id="grade"></div>
</main>
<script>
const questions=[{"q": "1947年、アメリカを中心とする西側陣営とソ連を中心とする東側陣営が対立した状態を何というか。", "choices": ["冷戦", "朝鮮戦争", "民族運動", "核軍縮"], "answer": 0}, {"q": "1949年に成立し、社会主義国として出発した国はどれか。", "choices": ["中華人民共和国", "大韓民国", "北朝鮮", "インド"], "answer": 0}, {"q": "1950年に始まり、東西対立を激しくした戦争はどれか。", "choices": ["朝鮮戦争", "ベトナム戦争", "湾岸戦争", "太平洋戦争"], "answer": 0}, {"q": "1951年、日本が48か国と結んだ条約はどれか。", "choices": ["サンフランシスコ平和条約", "日米安全保障条約", "日韓基本条約", "日ソ共同宣言"], "answer": 0}, {"q": "サンフランシスコ平和条約によって日本は何を回復したか。", "choices": ["主権", "植民地", "軍隊", "国際連盟の加盟資格"], "answer": 0}, {"q": "1951年に日本とアメリカの間で結ばれた条約はどれか。", "choices": ["日米安全保障条約", "日ソ共同宣言", "日韓基本条約", "日中共同声明"], "answer": 0}, {"q": "1956年、日本とソ連の国交を回復させたものはどれか。", "choices": ["日ソ共同宣言", "日米安全保障条約", "サンフランシスコ平和条約", "日韓基本条約"], "answer": 0}, {"q": "1956年、日本が加盟した国際機関はどれか。", "choices": ["国際連合", "EU", "ASEAN", "NATO"], "answer": 0}, {"q": "1950年代後半から日本で急速に進んだ経済発展を何というか。", "choices": ["高度経済成長", "バブル経済", "デフレーション", "鎖国"], "answer": 0}, {"q": "1964年に東京で開催された国際的な大会はどれか。", "choices": ["オリンピック", "万国博覧会", "アジア競技大会", "国連総会"], "answer": 0}, {"q": "高度経済成長期に「三種の神器」と呼ばれた家電の組合せはどれか。", "choices": ["テレビ・洗濯機・冷蔵庫", "自動車・冷蔵庫・パソコン", "テレビ・スマートフォン・電子レンジ", "洗濯機・エアコン・携帯電話"], "answer": 0}, {"q": "高度経済成長の一方で深刻化した問題はどれか。", "choices": ["公害", "鎖国", "人口減少", "農地改革"], "answer": 0}, {"q": "1960年代に問題となった四大公害病の一つはどれか。", "choices": ["水俣病", "スペイン風邪", "天然痘", "結核"], "answer": 0}, {"q": "1970年に大阪で開催された国際的な博覧会はどれか。", "choices": ["日本万国博覧会", "東京オリンピック", "国際花と緑の博覧会", "愛知万博"], "answer": 0}, {"q": "1972年に日本へ返還された地域はどこか。", "choices": ["沖縄", "台湾", "朝鮮半島", "樺太"], "answer": 0}, {"q": "1973年の石油危機のきっかけとなった出来事はどれか。", "choices": ["第四次中東戦争", "朝鮮戦争", "キューバ危機", "湾岸戦争"], "answer": 0}, {"q": "石油危機後、日本の産業で進んだ変化として適切なのはどれか。", "choices": ["省エネルギー化", "石炭利用の全面復活", "農業中心への転換", "鎖国政策"], "answer": 0}, {"q": "1970年代以降、アジアで経済発展を進めた国・地域として「NIES」に含まれないものはどれか。", "choices": ["日本", "韓国", "台湾", "香港"], "answer": 0}, {"q": "1980年代後半に日本で地価や株価が大きく上昇した経済状態はどれか。", "choices": ["バブル経済", "高度経済成長", "オイルショック", "デフレ"], "answer": 0}, {"q": "1991年にソ連が解体したことで終結したとされる対立は何か。", "choices": ["冷戦", "南北戦争", "日露戦争", "太平洋戦争"], "answer": 0}, {"q": "1990年代以降、世界各地の地域紛争などに対して日本が行った国際協力の一つはどれか。", "choices": ["PKOへの参加", "鎖国", "植民地支配", "軍事同盟からの脱退"], "answer": 0}, {"q": "1990年代に情報通信技術の発達によって急速に広がった世界的な変化を何というか。", "choices": ["グローバル化", "鎖国", "産業革命", "帝国主義"], "answer": 0}, {"q": "2000年代以降、日本が直面している課題として適切なのはどれか。", "choices": ["少子高齢化", "人口の急増", "識字率の低下", "植民地の拡大"], "answer": 0}, {"q": "国際社会で日本が果たす役割の一つとして適切なのはどれか。", "choices": ["国際協力や平和への貢献", "他国との交流を断つ", "国際機関から脱退する", "輸入を全面禁止する"], "answer": 0}, {"q": "戦後、日本でテレビや映画などが広く普及し、大衆が共通の文化を楽しむようになったことを何と関係づけられるか。", "choices": ["大衆化", "鎖国", "身分制", "封建化"], "answer": 0}, {"q": "将来の世代の利益を損なわずに、現在の世代の要求も満たす社会を目指す考え方はどれか。", "choices": ["持続可能な社会", "管理社会", "閉鎖社会", "単一社会"], "answer": 0}, {"q": "SDGsは何を意味するか。", "choices": ["持続可能な開発目標", "世界平和宣言", "国際貿易協定", "地球環境条約"], "answer": 0}, {"q": "インターネット上で情報を利用するとき、特に注意すべきことはどれか。", "choices": ["情報の正確性や発信者を確認する", "見つけた情報を必ず拡散する", "個人情報を公開する", "匿名なら何をしてもよい"], "answer": 0}, {"q": "情報社会で、情報を適切に扱い活用する能力を何というか。", "choices": ["情報リテラシー", "金融政策", "主権", "地方自治"], "answer": 0}, {"q": "世界規模で人・物・情報・資本などの移動が活発になることを何というか。", "choices": ["グローバル化", "高齢化", "都市化", "民主化"], "answer": 0}, {"q": "少子化とは、一般に何が減少することを指すか。", "choices": ["出生数や出生率", "平均寿命", "高齢者数", "外国人観光客"], "answer": 0}, {"q": "高齢化が進む社会で、社会保障を支える世代の負担について考えることが重要なのはなぜか。", "choices": ["世代間の支え合いに関係するため", "国境がなくなるため", "文化が消えるため", "選挙がなくなるため"], "answer": 0}, {"q": "地域の祭りや食文化など、長い間受け継がれてきた生活上の文化を何と呼ぶことができるか。", "choices": ["伝統文化", "軍事文化", "政治制度", "国際法"], "answer": 0}, {"q": "日本文化を次世代へ伝える方法として適切なのはどれか。", "choices": ["地域で体験や記録を通して継承する", "文化をすべて禁止する", "外国文化をすべて排除する", "記録を残さない"], "answer": 0}, {"q": "社会の中で人々が共通の目的を達成するために協力することを何と関係づけて考えられるか。", "choices": ["社会的存在", "孤立", "鎖国", "身分制"], "answer": 0}, {"q": "限られた資源を無駄なく使うことを重視する考え方はどれか。", "choices": ["効率", "公正", "多数決", "主権"], "answer": 0}, {"q": "人々に機会や負担を公平に配分することを重視する考え方はどれか。", "choices": ["公正", "効率", "情報化", "国際化"], "answer": 0}, {"q": "社会生活の中で、人々が守るべき共通のルールを何というか。", "choices": ["きまり", "文化財", "市場", "主権"], "answer": 0}, {"q": "多数決を行うときに重要なことはどれか。", "choices": ["少数意見にも配慮する", "少数意見を無視する", "多数派の人権をなくす", "話し合いをしない"], "answer": 0}, {"q": "民主主義の基本的な考え方として適切なのはどれか。", "choices": ["国民が政治に参加し意思を反映させる", "一人の人がすべてを決める", "軍人だけが政治を行う", "世襲だけで政治を決める"], "answer": 0}, {"q": "憲法によって国家権力を制限し、人権を保障する考え方を何というか。", "choices": ["立憲主義", "絶対主義", "封建主義", "帝国主義"], "answer": 0}, {"q": "法の支配とはどのような考え方か。", "choices": ["国家権力も法に従わなければならない", "政府だけが法を作り自由に破れる", "国民だけが法に従う", "裁判所が法を作る"], "answer": 0}, {"q": "日本国憲法の基本原理の一つはどれか。", "choices": ["基本的人権の尊重", "身分制度の維持", "天皇主権", "軍国主義"], "answer": 0}, {"q": "日本国憲法が施行されたのはいつか。", "choices": ["1947年5月3日", "1945年8月15日", "1951年9月8日", "1956年12月18日"], "answer": 0}, {"q": "日本国憲法の成立に大きな影響を与えた第二次世界大戦後の社会で、戦前と比べて重視されたものはどれか。", "choices": ["基本的人権", "軍部の権限", "植民地支配", "身分制度"], "answer": 0}, {"q": "国民主権とは何を意味するか。", "choices": ["国の政治の最終的な決定権が国民にある", "天皇がすべての政治を決める", "裁判官が国民を選ぶ", "政府が国民を選ぶ"], "answer": 0}, {"q": "日本国憲法第9条と深く関係する原則はどれか。", "choices": ["平和主義", "地方自治", "環境権", "財産権"], "answer": 0}, {"q": "個人の尊重とは、どのような考え方か。", "choices": ["一人ひとりをかけがえのない個人として尊重する", "多数派だけを尊重する", "国の利益だけを優先する", "職業で人の価値を決める"], "answer": 0}, {"q": "自由権の例として適切なのはどれか。", "choices": ["思想・良心の自由", "健康で文化的な最低限度の生活を営む権利", "教育を受ける権利", "裁判を受ける権利"], "answer": 0}, {"q": "表現の自由について、憲法上認められているものはどれか。", "choices": ["自分の意見を表現する自由", "他人の名誉を自由に傷つける権利", "他人の財産を自由に使う権利", "法律を自由に破る権利"], "answer": 0}];
const form=document.getElementById('test');
questions.forEach((x,i)=>{
 const section=i<25?'歴史':'公民';
 if(i===0||i===25) form.insertAdjacentHTML('beforeend',`<div class="section">${section}</div>`);
 let s=`<div class="card"><div class="qno">問${i+1}（2点）</div><div>${x.q}</div>`;
 x.choices.forEach((c,j)=>s+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}．${c}</label>`);
 s+='</div>'; form.insertAdjacentHTML('beforeend',s);
});
function grade(){
 let score=0,un=0;
 questions.forEach((x,i)=>{
  const a=document.querySelector(`input[name=q${i}]:checked`);
  if(!a) un++; else if(+a.value===x.answer) score+=2;
 });
 const g=document.getElementById('grade');
 g.style.display='block';
 let msg=score>=90?'90点以上です。よくできています。':score>=80?'80点以上です。間違えた問題を復習しましょう。':'まずは間違えた問題の用語・理由を確認しましょう。';
 g.innerHTML=`<h2>結果：${score} / 100点</h2><p>${msg}</p><p>未回答：${un}問</p>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
