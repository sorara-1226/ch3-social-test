<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3社会 2学期中間対策テスト 2</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#222}
header{background:#17365d;color:#fff;padding:22px 5%;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
.qno{font-weight:700;color:#17365d} .section{font-size:1.2em;font-weight:700;margin-top:25px}
label{display:block;padding:8px;border-radius:8px} label:hover{background:#eef3f9}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
#grade{background:#fff;border-radius:12px;padding:20px;margin:20px 0;display:none}
.ok{border-left:5px solid #2e7d32} .ng{border-left:5px solid #c62828}
.small{font-size:.9em;color:#666}
</style></head>
<body>
<header><h1>中学3年 社会 2学期中間対策テスト 2</h1>
<div>歴史25問＋公民25問／50問・100点満点／1問2点</div></header>
<main>
<p class="small">すべて解答してから「採点する」を押してください。選択肢は4択です。</p>
<form id="test"></form>
<button onclick="grade();return false;">採点する</button>
<div id="grade"></div>
</main>
<script>
const questions=[{"q": "1947年に制定された日本の新しい憲法は何か。", "choices": ["日本国憲法", "大日本帝国憲法", "明治憲法", "ポツダム宣言"], "answer": 0}, {"q": "冷戦期にアメリカとソ連が直接全面戦争を避けながら対立した背景の一つは何か。", "choices": ["核兵器の存在", "国際連盟の再建", "植民地の消滅", "農業人口の増加"], "answer": 0}, {"q": "朝鮮戦争をきっかけに、日本で需要が増えたものは何か。", "choices": ["特需", "農地", "植民地", "輸出規制"], "answer": 0}, {"q": "1950年代、日本の独立回復をめぐって結ばれた平和条約の相手国はどこか。", "choices": ["連合国の多数の国々", "ソ連だけ", "中国だけ", "朝鮮だけ"], "answer": 0}, {"q": "日本が国際連合に加盟した年はどれか。", "choices": ["1956年", "1945年", "1951年", "1964年"], "answer": 0}, {"q": "1950年代から1960年代にかけて日本の都市人口が増えた理由として適切なのはどれか。", "choices": ["工業化と都市への人口移動", "農業の急成長", "鎖国の強化", "海外植民地の拡大"], "answer": 0}, {"q": "高度経済成長を支えた要因の一つはどれか。", "choices": ["設備投資と技術革新", "輸入の全面禁止", "労働人口の急減", "農業への全面回帰"], "answer": 0}, {"q": "1964年に開通した新幹線は何線か。", "choices": ["東海道新幹線", "山陽新幹線", "東北新幹線", "九州新幹線"], "answer": 0}, {"q": "公害対策を進めるために1967年に制定された法律はどれか。", "choices": ["公害対策基本法", "環境基本法", "原子力基本法", "地方自治法"], "answer": 0}, {"q": "1971年にアメリカがドルと金の交換を停止したことは何と呼ばれるか。", "choices": ["ニクソン・ショック", "オイルショック", "金融恐慌", "バブル崩壊"], "answer": 0}, {"q": "1973年の石油危機で、日本の物価はどうなったか。", "choices": ["急上昇した", "急低下した", "全く変化しなかった", "法律で固定された"], "answer": 0}, {"q": "1972年の日中国交正常化に関する文書はどれか。", "choices": ["日中共同声明", "日ソ共同宣言", "日韓基本条約", "サンフランシスコ平和条約"], "answer": 0}, {"q": "1970年代以降、日本の企業が海外に進出する動きが強まった理由の一つはどれか。", "choices": ["国際競争や円高などへの対応", "鎖国政策", "人口の急増", "農地改革"], "answer": 0}, {"q": "1985年のプラザ合意後、日本では何が急速に進んだか。", "choices": ["円高", "円安", "鎖国", "農地の拡大"], "answer": 0}, {"q": "1980年代後半に株価・地価が上昇し続けた後、1990年代初めに急落した現象は何か。", "choices": ["バブル経済の崩壊", "高度成長", "石油危機", "戦後復興"], "answer": 0}, {"q": "1993年に成立し、政治改革を進める契機となった法律の一つはどれか。", "choices": ["政治改革関連法", "農地改革法", "国家総動員法", "治安維持法"], "answer": 0}, {"q": "1990年代に世界的に広がったインターネットの普及は何を促進したか。", "choices": ["情報化", "鎖国", "身分制", "農業化"], "answer": 0}, {"q": "1995年に発生し、日本の防災意識に大きな影響を与えた災害はどれか。", "choices": ["阪神・淡路大震災", "関東大震災", "東日本大震災", "伊勢湾台風"], "answer": 0}, {"q": "1997年に発効した、地球温暖化対策に関する国際的な取り決めはどれか。", "choices": ["京都議定書", "パリ協定", "ラムサール条約", "ワシントン条約"], "answer": 0}, {"q": "2000年代、日本企業が海外生産を進めるなど国際分業が進んだ背景はどれか。", "choices": ["グローバル化", "鎖国", "身分制度", "農地改革"], "answer": 0}, {"q": "戦後の日本で、若者向けの音楽やファッションなどが広がったことは文化の何を示すか。", "choices": ["多様化", "単一化", "封建化", "軍事化"], "answer": 0}, {"q": "テレビが家庭に普及したことで、社会にどのような変化が生じたか。", "choices": ["大衆文化が広がった", "識字率が低下した", "選挙権がなくなった", "農業人口が増えた"], "answer": 0}, {"q": "1990年代以降、日本が国際社会で行っている活動の一つはどれか。", "choices": ["政府開発援助（ODA）", "植民地支配", "関税の全面撤廃", "国際機関の拒否"], "answer": 0}, {"q": "現代の日本が国際社会で重視する課題として適切なのはどれか。", "choices": ["環境・平和・人道などへの協力", "海外との交流停止", "国際貿易の停止", "国際機関からの脱退"], "answer": 0}, {"q": "戦後の日本で生活水準が向上し、家電製品などが家庭に普及したことと関係が深いのはどれか。", "choices": ["高度経済成長", "冷戦終結", "石油危機以前の戦争", "農地改革"], "answer": 0}, {"q": "持続可能な社会を実現するため、環境・経済・社会をバランスよく考える必要があるのはなぜか。", "choices": ["将来も社会を維持できるようにするため", "経済だけを優先するため", "環境を無視するため", "人口を必ず増やすため"], "answer": 0}, {"q": "地球温暖化の原因の一つとされる温室効果ガスはどれか。", "choices": ["二酸化炭素", "酸素", "窒素", "水素"], "answer": 0}, {"q": "インターネット上の個人情報を守るために適切な行動はどれか。", "choices": ["住所やパスワードを不用意に公開しない", "全員にパスワードを教える", "本名を必ず公開する", "知らない相手の要求に従う"], "answer": 0}, {"q": "SNSで他人の写真を投稿するときに注意すべきことはどれか。", "choices": ["本人の権利やプライバシーに配慮する", "無断で必ず公開する", "写真なら権利はないと考える", "一度投稿したら責任はない"], "answer": 0}, {"q": "グローバル化によって進んだ国際分業とは何か。", "choices": ["国や地域が得意な生産を分担すること", "すべての国が同じ物を作ること", "貿易を禁止すること", "国境をなくして政府をなくすこと"], "answer": 0}, {"q": "少子高齢化が進むことで生じる課題として適切なのはどれか。", "choices": ["社会保障の負担と支え手の問題", "学校の数が必ず増える", "若年人口が必ず増える", "高齢者がいなくなる"], "answer": 0}, {"q": "少子高齢化への対応として考えられるものはどれか。", "choices": ["子育て支援や働き方の見直し", "社会保障をすべてなくす", "高齢者を社会から排除する", "教育を禁止する"], "answer": 0}, {"q": "文化が地域や世代を超えて受け継がれるために重要なことはどれか。", "choices": ["記録し、学び、実践すること", "文化を秘密にすること", "伝統をすべて変えること", "若者を文化から遠ざけること"], "answer": 0}, {"q": "外国の文化を受け入れるときに大切な態度はどれか。", "choices": ["互いの文化を尊重する", "自国文化だけを正しいとする", "相手の文化を禁止する", "交流を拒否する"], "answer": 0}, {"q": "社会の中で人間が他者と関わりながら生活することを考える際、重要なものはどれか。", "choices": ["協力と合意形成", "完全な孤立", "無条件の命令", "競争だけ"], "answer": 0}, {"q": "効率と公正が両立しない場合に重要なのは何か。", "choices": ["目的や影響を考えて調整すること", "必ず効率だけを選ぶこと", "必ず公正だけを選ぶこと", "話し合いをやめること"], "answer": 0}, {"q": "学校生活のきまりを作るときに重要なのはどれか。", "choices": ["関係する人が理由を考え話し合う", "一人だけで決める", "理由を説明しない", "一度も見直さない"], "answer": 0}, {"q": "民主主義における多数決の問題点はどれか。", "choices": ["少数意見が十分反映されない可能性がある", "多数派の意見が反映されること", "話し合いが行われること", "投票できること"], "answer": 0}, {"q": "立憲主義が重視するものはどれか。", "choices": ["憲法による権力の制限", "政府権力の無制限化", "国民の権利の制限", "裁判の廃止"], "answer": 0}, {"q": "法の支配と人の支配の違いとして適切なのはどれか。", "choices": ["権力者も法に拘束されるかどうか", "国民が法律を作るかどうかだけ", "裁判所があるかどうかだけ", "選挙があるかどうかだけ"], "answer": 0}, {"q": "日本国憲法の三大原則に含まれないものはどれか。", "choices": ["基本的人権の尊重", "国民主権", "平和主義", "議会主権"], "answer": 0}, {"q": "日本国憲法の前文で示される考え方と関係が深いものはどれか。", "choices": ["恒久平和への願い", "植民地の拡大", "軍事力の強化", "身分制度"], "answer": 0}, {"q": "日本国憲法が公布されたのはいつか。", "choices": ["1946年11月3日", "1947年5月3日", "1945年8月15日", "1951年9月8日"], "answer": 0}, {"q": "日本国憲法の基本的人権は、憲法上どのようなものとして保障されているか。", "choices": ["侵すことのできない永久の権利", "政府が自由に取り消せる権利", "一部の人だけの権利", "選挙のときだけの権利"], "answer": 0}, {"q": "国民主権を具体化する制度として適切なのはどれか。", "choices": ["選挙", "世襲政治", "軍部による統治", "身分制"], "answer": 0}, {"q": "日本国憲法第9条で放棄すると定められているものはどれか。", "choices": ["戦争と武力による威嚇・行使", "国際交流", "文化活動", "国会での議論"], "answer": 0}, {"q": "個人の尊重と幸福追求権を定めている条文はどれか。", "choices": ["憲法第13条", "憲法第9条", "憲法第25条", "憲法第41条"], "answer": 0}, {"q": "精神の自由に含まれるものはどれか。", "choices": ["信教の自由", "居住・移転の自由", "職業選択の自由", "財産権"], "answer": 0}, {"q": "経済活動の自由に含まれるものはどれか。", "choices": ["職業選択の自由", "思想・良心の自由", "信教の自由", "表現の自由"], "answer": 0}, {"q": "身体の自由を保障する規定として関係が深いものはどれか。", "choices": ["奴隷的拘束や苦役からの自由", "学問の自由", "信教の自由", "表現の自由"], "answer": 0}];
const form=document.getElementById('test');
questions.forEach((x,i)=>{
 const section=i<25?'歴史':'公民';
 if(i===0||i===25) form.insertAdjacentHTML('beforeend',`<div class="section">${section}</div>`);
 let s=`<div class="card"><div class="qno">問${i+1}（2点）</div><div>${x.q}</div>`;
 x.choices.forEach((c,j)=>s+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}．${c}</label>`);
 s+='</div>'; form.insertAdjacentHTML('beforeend',s);
});
function grade(){
 let score=0,un=0;
 questions.forEach((x,i)=>{
  const a=document.querySelector(`input[name=q${i}]:checked`);
  if(!a) un++; else if(+a.value===x.answer) score+=2;
 });
 const g=document.getElementById('grade');
 g.style.display='block';
 let msg=score>=90?'90点以上です。よくできています。':score>=80?'80点以上です。間違えた問題を復習しましょう。':'まずは間違えた問題の用語・理由を確認しましょう。';
 g.innerHTML=`<h2>結果：${score} / 100点</h2><p>${msg}</p><p>未回答：${un}問</p>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
