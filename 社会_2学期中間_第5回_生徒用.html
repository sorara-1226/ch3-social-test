<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3社会 2学期中間対策テスト 5</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.7;margin:0;background:#f5f7fb;color:#222}
header{background:#17365d;color:#fff;padding:22px 5%;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
.qno{font-weight:700;color:#17365d} .section{font-size:1.2em;font-weight:700;margin-top:25px}
label{display:block;padding:8px;border-radius:8px} label:hover{background:#eef3f9}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
#grade{background:#fff;border-radius:12px;padding:20px;margin:20px 0;display:none}
.ok{border-left:5px solid #2e7d32} .ng{border-left:5px solid #c62828}
.small{font-size:.9em;color:#666}
</style></head>
<body>
<header><h1>中学3年 社会 2学期中間対策テスト 5</h1>
<div>歴史25問＋公民25問／50問・100点満点／1問2点</div></header>
<main>
<p class="small">すべて解答してから「採点する」を押してください。選択肢は4択です。</p>
<form id="test"></form>
<button onclick="grade();return false;">採点する</button>
<div id="grade"></div>
</main>
<script>
const questions=[{"q": "第二次世界大戦後、アメリカとソ連を中心とする対立が続いた時期を何というか。", "choices": ["冷戦", "戦国時代", "南北戦争", "三国時代"], "answer": 0}, {"q": "冷戦下で核兵器を持つ国同士が対立したことから、世界が恐れたものは何か。", "choices": ["核戦争", "農業危機", "文化交流", "人口増加"], "answer": 0}, {"q": "1948年に成立したイスラエルをめぐって続いた中東の対立と関係が深い地域はどこか。", "choices": ["中東", "東アジア", "北欧", "南米"], "answer": 0}, {"q": "日本が独立を回復する条件を定めた1951年の条約はどれか。", "choices": ["サンフランシスコ平和条約", "日米安全保障条約", "日韓基本条約", "日中共同声明"], "answer": 0}, {"q": "日本の国際社会への復帰を示す出来事はどれか。", "choices": ["国際連合への加盟", "国際連盟の脱退", "植民地の獲得", "鎖国"], "answer": 0}, {"q": "1960年代、日本とアメリカの安全保障関係をめぐって起こった社会運動はどれか。", "choices": ["安保闘争", "農地改革", "自由民権運動", "護国運動"], "answer": 0}, {"q": "高度経済成長によって日本の産業構造はどう変化したか。", "choices": ["第二次産業・第三次産業の比重が高まった", "農業だけに集中した", "工業が消滅した", "サービス業がなくなった"], "answer": 0}, {"q": "高度経済成長期に都市人口が増加した理由として適切なのはどれか。", "choices": ["工場や企業が都市に集中し雇用が増えた", "農業人口が急増した", "海外植民地が増えた", "国境がなくなった"], "answer": 0}, {"q": "公害問題への対策として1970年に開かれた国会は何と呼ばれるか。", "choices": ["公害国会", "臨時国会", "帝国議会", "通常国会だけ"], "answer": 0}, {"q": "四大公害病のうち、カドミウムによるものはどれか。", "choices": ["イタイイタイ病", "水俣病", "四日市ぜんそく", "新潟水俣病"], "answer": 0}, {"q": "1972年に沖縄が日本へ返還されたことと関係が深いものはどれか。", "choices": ["施政権の返還", "国連加盟", "高度成長開始", "冷戦開始"], "answer": 0}, {"q": "1973年の石油危機によって日本で深刻化した問題はどれか。", "choices": ["物価上昇", "人口急増", "食料輸出の急増", "農地拡大"], "answer": 0}, {"q": "1980年代、日本の輸出増加を背景にアメリカなどとの間で何が問題になったか。", "choices": ["貿易摩擦", "公害病", "冷戦", "農地改革"], "answer": 0}, {"q": "バブル経済の時期に大きく上昇したものはどれか。", "choices": ["土地や株式の価格", "失業率だけ", "出生率だけ", "農地面積"], "answer": 0}, {"q": "バブル経済が崩壊した後、日本で長期的に問題となったものはどれか。", "choices": ["景気低迷や不良債権問題", "高度成長の加速", "人口急増", "植民地問題"], "answer": 0}, {"q": "冷戦終結の象徴とされる1989年の出来事はどれか。", "choices": ["ベルリンの壁崩壊", "日ソ共同宣言", "沖縄返還", "東京オリンピック"], "answer": 0}, {"q": "1991年にソ連が解体したことで、世界の国際関係はどう変化したか。", "choices": ["冷戦の二極構造が終わった", "東西対立が始まった", "国際機関が消滅した", "貿易が停止した"], "answer": 0}, {"q": "1990年代以降、世界の国々の経済的な結びつきが強まったことを何というか。", "choices": ["グローバル化", "鎖国", "封建化", "国有化"], "answer": 0}, {"q": "2000年代、中国などアジア諸国の経済発展によって日本との関係はどうなったか。", "choices": ["貿易や企業活動などの結びつきが強まった", "交流がなくなった", "日本が植民地化した", "国際分業がなくなった"], "answer": 0}, {"q": "戦後文化で、テレビ・映画・音楽などが広く普及したことを何と関係づけられるか。", "choices": ["大衆化", "鎖国", "身分制", "農村化"], "answer": 0}, {"q": "インターネットやスマートフォンの普及が文化に与えた影響として適切なのはどれか。", "choices": ["情報発信の担い手が多様化した", "情報が一方向になった", "文化交流がなくなった", "テレビだけが残った"], "answer": 0}, {"q": "現代の日本で、国際社会との関係を深める一例はどれか。", "choices": ["国際的な環境・災害・開発協力", "国際貿易の停止", "外国人の入国禁止", "国際機関からの脱退"], "answer": 0}, {"q": "日本が今後国際社会で役割を果たす上で重要な考え方はどれか。", "choices": ["他国と協力して共通課題に取り組む", "他国との関係を断つ", "自国だけで全問題を解決する", "国際法を無視する"], "answer": 0}, {"q": "戦後の日本で人々の生活が豊かになり、家電製品などが普及した背景はどれか。", "choices": ["経済成長と所得の増加", "人口の急減", "輸入の禁止", "農業中心への回帰"], "answer": 0}, {"q": "高度経済成長によって生じた負の側面として適切なのはどれか。", "choices": ["公害や都市問題", "識字率の低下", "植民地の拡大", "国際連盟の再結成"], "answer": 0}, {"q": "持続可能な社会の実現に向け、資源を循環させる取り組みとして適切なのはどれか。", "choices": ["リサイクル", "大量廃棄", "使い捨ての拡大", "資源の無制限利用"], "answer": 0}, {"q": "SDGsが目指すものとして適切なのはどれか。", "choices": ["貧困・環境・教育など幅広い課題の解決", "経済成長だけ", "軍事力の強化だけ", "国内問題だけ"], "answer": 0}, {"q": "情報化社会で個人情報が漏えいすると問題になる理由はどれか。", "choices": ["本人の権利や安全が侵害される可能性があるため", "情報が必ず正しくなるため", "通信が速くなるため", "文化が増えるため"], "answer": 0}, {"q": "ネット上の情報を見極める力として重要なのはどれか。", "choices": ["情報リテラシー", "軍事力", "人口政策", "外交権"], "answer": 0}, {"q": "グローバル化した社会で、国際的な課題に一国だけで対応するのが難しい例はどれか。", "choices": ["地球温暖化", "学校の校則", "地域の祭り", "個人の趣味"], "answer": 0}, {"q": "外国人との共生を進める上で必要なものはどれか。", "choices": ["互いの文化や人権を尊重すること", "一方の文化を禁止すること", "言語を強制すること", "交流をなくすこと"], "answer": 0}, {"q": "少子化が続くと、将来的にどのような変化が予想されるか。", "choices": ["若年人口の減少", "子どもの急増", "高齢者の消滅", "労働力人口の急増"], "answer": 0}, {"q": "高齢化への対応として、社会保障制度を持続させるために必要な視点はどれか。", "choices": ["負担と給付のバランスを考える", "給付だけ増やす", "負担をすべてなくす", "制度を考えない"], "answer": 0}, {"q": "地域文化を継承する上で、若い世代の参加が重要なのはなぜか。", "choices": ["将来の担い手になるため", "文化を変えるためだけ", "高齢者を排除するため", "観光客を増やすため"], "answer": 0}, {"q": "日本文化が海外からの影響を受けながら発展した例として適切なのはどれか。", "choices": ["漢字や仏教などを取り入れたこと", "外国文化を一切受け入れなかったこと", "文化交流がなかったこと", "鎖国中も交流がゼロだったこと"], "answer": 0}, {"q": "社会的存在としての人間が社会生活を送るために必要なのはどれか。", "choices": ["他者との協力とルール", "完全な孤立", "競争だけ", "命令への無条件服従"], "answer": 0}, {"q": "効率を考えるときの基本的な問いはどれか。", "choices": ["限られた資源でどれだけ大きな成果を得られるか", "誰が一番強いか", "誰の意見が多いかだけ", "文化が古いか"], "answer": 0}, {"q": "公正を考えるとき、機会の公正とは何か。", "choices": ["挑戦する機会が不当に奪われないこと", "全員が同じ結果になること", "多数派だけが参加すること", "努力を禁止すること"], "answer": 0}, {"q": "きまりを作るときに必要なことはどれか。", "choices": ["目的・内容・影響を考え、必要に応じて見直すこと", "一度決めたら絶対に変えないこと", "理由を説明しないこと", "一人で決めること"], "answer": 0}, {"q": "民主主義の基本原理として適切なのはどれか。", "choices": ["国民の意思に基づいて政治を行うこと", "一部の人だけが政治を行うこと", "権力者が法を無視すること", "選挙を行わないこと"], "answer": 0}, {"q": "立憲主義が必要とされる理由として適切なのはどれか。", "choices": ["国家権力の暴走を防ぎ人権を守るため", "政府に無制限の権力を与えるため", "国民を政治から遠ざけるため", "裁判をなくすため"], "answer": 0}, {"q": "法の支配の考え方では、国会で作られた法律も何に適合する必要があるか。", "choices": ["憲法", "世論調査", "新聞", "多数派の感情"], "answer": 0}, {"q": "日本国憲法の三大原則の一つである基本的人権の尊重は、何を保障するか。", "choices": ["人間らしく尊重されて生きる権利", "政府の自由", "多数派だけの権利", "一部の人の特権"], "answer": 0}, {"q": "日本国憲法が施行された日を記念する祝日はどれか。", "choices": ["憲法記念日", "文化の日", "建国記念の日", "敬老の日"], "answer": 0}, {"q": "国民主権を具体的に示すものとして、選挙のほかに国民投票が関係するのは何か。", "choices": ["憲法改正の国民投票", "最高裁判所の裁判官を国民が直接選ぶこと", "内閣総理大臣の直接選挙", "法律のすべてを直接決めること"], "answer": 0}, {"q": "平和主義を定めた憲法第9条では、国際紛争を解決する手段として何を放棄するとしているか。", "choices": ["戦争", "外交", "国際協力", "国際交流"], "answer": 0}, {"q": "個人の尊重を定めた憲法第13条と関係が深い考え方はどれか。", "choices": ["一人ひとりの人格や自己決定を尊重すること", "多数派だけを尊重すること", "国家だけを尊重すること", "職業で人格を決めること"], "answer": 0}, {"q": "表現の自由には何が含まれるか。", "choices": ["言論・出版などによって意見を表す自由", "他人を傷つける自由", "法律を破る自由", "他人の財産を奪う自由"], "answer": 0}, {"q": "信教の自由とは何か。", "choices": ["信仰する宗教を選んだり、信仰しないことを選んだりする自由", "他人に宗教を強制する自由", "宗教団体だけが政治をする自由", "宗教を理由に法律を破る自由"], "answer": 0}, {"q": "職業選択の自由が保障される意味として適切なのはどれか。", "choices": ["原則として自分の意思で職業を選べること", "政府が職業をすべて指定すること", "身分で職業を固定すること", "家族の職業を必ず継ぐこと"], "answer": 0}];
const form=document.getElementById('test');
questions.forEach((x,i)=>{
 const section=i<25?'歴史':'公民';
 if(i===0||i===25) form.insertAdjacentHTML('beforeend',`<div class="section">${section}</div>`);
 let s=`<div class="card"><div class="qno">問${i+1}（2点）</div><div>${x.q}</div>`;
 x.choices.forEach((c,j)=>s+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}．${c}</label>`);
 s+='</div>'; form.insertAdjacentHTML('beforeend',s);
});
function grade(){
 let score=0,un=0;
 questions.forEach((x,i)=>{
  const a=document.querySelector(`input[name=q${i}]:checked`);
  if(!a) un++; else if(+a.value===x.answer) score+=2;
 });
 const g=document.getElementById('grade');
 g.style.display='block';
 let msg=score>=90?'90点以上です。よくできています。':score>=80?'80点以上です。間違えた問題を復習しましょう。':'まずは間違えた問題の用語・理由を確認しましょう。';
 g.innerHTML=`<h2>結果：${score} / 100点</h2><p>${msg}</p><p>未回答：${un}問</p>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
